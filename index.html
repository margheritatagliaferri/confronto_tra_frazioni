<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frazioni: maggiore o minore?</title>
<style>
:root{--bg:#f4f8fc;--card:#fff;--tx:#1d2b3a;--mut:#5b6b7b;--ac:#03abf2;--ok:#2e9e5b;--ko:#d64545;--bd:#cfdbe8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a22;--card:#1c2733;--tx:#e8eef5;--mut:#9fb0c1;--ac:#4cc3f5;--ok:#4cc27f;--ko:#ef6b6b;--bd:#33465a}}
:root[data-theme="dark"]{--bg:#121a22;--card:#1c2733;--tx:#e8eef5;--mut:#9fb0c1;--ac:#4cc3f5;--ok:#4cc27f;--ko:#ef6b6b;--bd:#33465a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:640px;padding:16px}
h1{font-size:1.4rem;text-align:center;margin:8px 0 4px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem;margin:8px 0}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:24px 10px 18px;margin:20px 0}
.side{display:flex;flex-direction:column;align-items:center;gap:12px}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:2.8rem;line-height:1.1;font-weight:bold}
.fr span:first-child{border-bottom:4px solid currentColor;padding:0 12px 2px}
.fr span:last-child{padding-top:2px}
.vis{width:90%;height:14px;border:2px solid var(--mut);border-radius:6px;overflow:hidden;opacity:0}
.vis i{display:block;height:100%;background:var(--ac)}
.show .vis{opacity:1}
.slot{width:64px;height:64px;margin-top:10px;border:3px dashed var(--mut);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:bold}
.slot.ok{border:3px solid var(--ok);color:var(--ok)}
.slot.ko{border:3px solid var(--ko);color:var(--ko)}
.choices{display:flex;justify-content:center;gap:20px}
.sym{width:110px;height:90px;font:inherit;font-size:3rem;font-weight:bold;background:var(--card);color:var(--tx);border:3px solid var(--bd);border-radius:16px;cursor:pointer}
.sym:hover:not(:disabled){border-color:var(--ac)}
.sym.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.sym.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--card))}
.fb{min-height:52px;text-align:center;margin:16px 0 6px;font-size:1.05rem}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.btn{display:block;margin:6px auto;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 26px;font:inherit;font-size:1.05rem;cursor:pointer}
.btn[hidden]{display:none}
.end{text-align:center;background:var(--card);border-radius:16px;padding:26px;border:2px solid var(--bd)}
.end .big{font-size:3rem;margin:8px 0}
@media (max-width:420px){.fr{font-size:2.2rem}.slot{width:50px;height:50px;font-size:1.8rem}.sym{width:90px}}
</style>
</head>
<body>
<div class="app">
  <h1>Frazioni: maggiore o minore?</h1>
  <div id="game">
    <div class="top"><span id="num"></span><span id="pt"></span></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="board" id="board"></div>
    <div class="choices">
      <button class="sym" id="gt" aria-label="maggiore">&gt;</button>
      <button class="sym" id="lt" aria-label="minore">&lt;</button>
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next" hidden>Avanti ➜</button>
  </div>
  <div id="end" class="end" hidden></div>
</div>
<script>
const POOL=[[3,4,3,7],[2,3,1,3],[13,11,13,9],[2,6,5,6],[1,8,3,8],[7,4,8,5],[1,5,6,8],[3,4,1,2],[7,2,7,12],[5,8,5,3]];
const N=POOL.length;
let qs,i,score,done;
const $=id=>document.getElementById(id);
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function fr(n,d){return `<span class="fr"><span>${n}</span><span>${d}</span></span>`}
function side(n,d){return `<div class="side">${fr(n,d)}<span class="vis"><i style="width:${Math.min(100,n/d*100)}%"></i></span></div>`}
function start(){qs=shuffle(POOL.slice());i=0;score=0;$('end').hidden=true;$('game').hidden=false;show()}
function show(){
  done=false;const q=qs[i];
  $('num').textContent=`Confronto ${i+1} di ${N}`;$('pt').textContent=`Punti: ${score}`;
  $('pb').style.width=(i/N*100)+'%';
  $('board').className='board';
  $('board').innerHTML=side(q[0],q[1])+'<div class="slot" id="slot">?</div>'+side(q[2],q[3]);
  ['gt','lt'].forEach(id=>{$(id).disabled=false;$(id).className='sym'});
  $('fb').textContent='';$('fb').className='fb';$('next').hidden=true;
}
function answer(sym){
  if(done)return;done=true;
  const q=qs[i],c=q[0]*q[3]-q[2]*q[1],right=c>0?'gt':'lt';
  const s={gt:'>',lt:'<'};
  $('board').classList.add('show');
  $('gt').disabled=$('lt').disabled=true;
  $(right).classList.add('ok');
  $('slot').textContent=s[right];$('slot').classList.add('ok');
  if(sym===right){score++;$('fb').className='fb ok';$('fb').textContent='Esatto! ✔'}
  else{$(sym).classList.add('ko');$('fb').className='fb ko';$('fb').textContent='Non è il segno giusto: riguarda le barrette!'}
  $('pt').textContent=`Punti: ${score}`;
  $('next').textContent=i===N-1?'Vedi il risultato':'Avanti ➜';$('next').hidden=false;
}
$('gt').onclick=()=>answer('gt');$('lt').onclick=()=>answer('lt');
$('next').onclick=()=>{i++;if(i<N)show();else finish()};
function finish(){
  $('game').hidden=true;$('end').hidden=false;
  const m=score===N?'Perfetto, campione delle frazioni! 🏆':score>=7?'Bravo, ci sei quasi! 👏':score>=5?'Buon lavoro, riprova per migliorare! 💪':'Ripassa un po’ e riprova: ce la farai! 📚';
  $('end').innerHTML=`<div>Hai finito!</div><div class="big">${score} / ${N}</div><p>${m}</p><button class="btn" onclick="start()">Gioca ancora</button>`;
}
start();
</script>
</body>
</html>
